server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Strip the base path prefix if the upstream proxy (Front Door) has not already done so.
    # When BASE_PATH is / these rewrites are no-ops (double-slash paths are normalised away by nginx).
    rewrite ^BASE_PATH(/.+)$ $1 last;
    rewrite ^BASE_PATH/?$ / last;

    # Security headers at the server level apply only when a location block defines NO add_header
    # directives of its own (nginx inheritance rule). The two location blocks below both define
    # add_header, so they must repeat every security header they need.
    #
    # These values are NOT the source of truth: security-headers.mjs is, because the Azure App
    # Service deployments serve the same app from server.mjs and must send the same set. Change
    # both together — scripts/check-headers.mjs runs on every build and fails if they diverge,
    # including if one block here is missing a header the others have.
    #
    # API_ORIGIN is substituted by docker-entrypoint.sh from the API_ORIGIN environment variable.
    # Leave it unset when the API is served from this same origin; set it when the API is on a
    # different host, or every request from the app is blocked by connect-src.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' API_ORIGIN https://login.microsoftonline.com https://*.microsoftonline.com https://*.msftauth.net https://*.ciamlogin.com https://dc.services.visualstudio.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://*.sentry.io; frame-src https://login.microsoftonline.com https://*.microsoftonline.com https://*.msftauth.net https://*.ciamlogin.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Runtime files for the Azure App Service deployment. `npm run build` copies them into dist/
    # so they ride along in this image too; they are the server, not part of the site.
    # No add_header here, so the server-level set above is inherited.
    location ~ ^/(server\.mjs|security-headers\.mjs|csp-origins\.json)$ {
        return 404;
    }

    # Static assets — content-hash filenames make these safe to cache indefinitely.
    # Security headers repeated because nginx does not inherit add_header from the server block
    # when this location block defines its own add_header directives.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' API_ORIGIN https://login.microsoftonline.com https://*.microsoftonline.com https://*.msftauth.net https://*.ciamlogin.com https://dc.services.visualstudio.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://*.sentry.io; frame-src https://login.microsoftonline.com https://*.microsoftonline.com https://*.msftauth.net https://*.ciamlogin.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Handle SPA routing — serve index.html for all routes.
    # BASE_PATH prefix is stripped by the upstream proxy (Front Door) before reaching this server.
    # Never cache index.html: it is the SPA entry point and must always be fresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' API_ORIGIN https://login.microsoftonline.com https://*.microsoftonline.com https://*.msftauth.net https://*.ciamlogin.com https://dc.services.visualstudio.com https://*.applicationinsights.azure.com https://*.in.applicationinsights.azure.com https://*.monitor.azure.com https://*.sentry.io; frame-src https://login.microsoftonline.com https://*.microsoftonline.com https://*.msftauth.net https://*.ciamlogin.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
