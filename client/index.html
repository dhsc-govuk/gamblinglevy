<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/images/icons/favicon.ico" />

    <!-- GOV.UK Frontend Fonts - hosted locally to avoid CORS issues -->
    <style>
      @font-face {
        font-family: 'GDS Transport';
        font-style: normal;
        font-weight: 400;
        src: url('/fonts/light-94a07e06a1-v2.woff2') format('woff2'), url('/fonts/light-f591b13f7d-v2.woff') format('woff');
        font-display: swap;
      }
      @font-face {
        font-family: 'GDS Transport';
        font-style: normal;
        font-weight: 700;
        src: url('/fonts/bold-b542beb274-v2.woff2') format('woff2'), url('/fonts/bold-affa96571d-v2.woff') format('woff');
        font-display: swap;
      }

      /* Global font application - GOV.UK Design System requires GDS Transport everywhere */
      *,
      *::before,
      *::after {
        font-family: 'GDS Transport', arial, sans-serif;
      }

      html,
      body {
        font-family: 'GDS Transport', arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Form elements don't inherit fonts by default */
      button,
      input,
      select,
      textarea,
      optgroup {
        font-family: 'GDS Transport', arial, sans-serif;
      }
    </style>

    <meta name="viewport" content="minimum-scale=1, initial-scale=1, width=device-width" />
    <meta name="theme-color" content="#0b0c0c" />
    <meta name="gambling-levy" content="gambling-levy" />
    <link rel="apple-touch-icon" href="/images/icons/apple-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Share progress preventing gambling harms - GOV.UK</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      govuk-frontend scopes its JavaScript-dependent rules to this class, including the ones that hide an
      unselected conditional reveal (.govuk-radios__conditional--hidden / .govuk-checkboxes__conditional--hidden).
      Without it those panels are always visible (BLUM-7040). Set before React paints so none flashes open.

      React — not govuk-frontend's JS — drives those reveals; this app loads govuk's CSS only, never initAll.
      So the class also means any govuk component that needs JS renders in its JS-enabled state with nothing
      to drive it: .govuk-accordion__section-content and .govuk-tabs__panel--hidden would be display:none and
      never open. Nothing renders that markup today. If you add an accordion or tabs, drive it from React or
      initialise govuk-frontend's JS module.
    -->
    <script>
      document.body.classList.add('govuk-frontend-supported');
    </script>
    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
